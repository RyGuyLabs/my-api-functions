[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[functions.save-profile]
  environment = ["FIREBASE_SERVICE_ACCOUNT"]

[functions.vocal-coach]
  environment = ["FIRST_API_KEY"]

[functions.lead-qualifier]
  environment = ["FIRST_API_KEY", "RYGUY_SEARCH_API_KEY", "RYGUY_SEARCH_ENGINE_ID"]

[functions.lead-generator]
  environment = [
    "LEAD_QUALIFIER_API_KEY",
    "RYGUY_SEARCH_API_KEY",
    "B2B_PAIN_CSE_ID",
    "CORP_COMP_CSE_ID",
    "TECH_SIM_CSE_ID",
    "SOCIAL_PRO_CSE_ID",
    "DIR_INFO_CSE_ID"
  ]

[functions.opportunity-preview]
environment = ["FIREBASE_SERVICE_ACCOUNT"]

[functions.firebase-public-config]
environment = [
  "FIREBASE_API_KEY",
  "FIREBASE_PROJECT_ID",
  "FIREBASE_APP_ID",
  "FIREBASE_AUTH_DOMAIN"
]
